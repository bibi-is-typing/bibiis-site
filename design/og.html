<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* og.png 원본 (1200×630). 렌더: 이 파일을 1200×630으로 캡처 */
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#FFFFFF;color:#18181B;font-family:"Pretendard Variable",Pretendard,sans-serif;-webkit-font-smoothing:antialiased}
.glow{position:absolute;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(185,167,255,.45),transparent 55%),radial-gradient(circle at 70% 70%,rgba(247,178,225,.4),transparent 55%),radial-gradient(circle at 30% 80%,rgba(159,216,255,.4),transparent 55%);right:-200px;top:-260px}
.dots{position:absolute;left:0;bottom:0;width:420px;height:300px;background-image:radial-gradient(#9b87f5 1.6px,transparent 1.8px);background-size:14px 14px;-webkit-mask-image:radial-gradient(ellipse at 0% 100%,#000 10%,transparent 65%);opacity:.55}
.copy{position:absolute;left:72px;top:70px;width:600px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.logo i{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 200deg,#B9A7FF,#F7B2E1,#9FD8FF,#B9F0DA,#B9A7FF)}
.badge{display:inline-block;margin-top:42px;font-size:17px;font-weight:600;color:#5636CC;background:linear-gradient(90deg,#ECE6FF,#FCE7F4,#E3F3FF);padding:8px 16px;border-radius:999px}
h1{margin-top:20px;font-size:52px;line-height:1.24;letter-spacing:-.045em;font-weight:800;word-break:keep-all}
h1 em{font-style:normal;color:#6D4AE8}
.proof{position:absolute;left:72px;bottom:64px;display:flex;flex-wrap:wrap;gap:10px;width:600px}
.proof span{font-size:17px;color:#52525B;background:#fff;border:1px solid #EAEAEE;border-radius:999px;padding:8px 15px}
.proof b{color:#18181B}
.shots{position:absolute;right:-40px;top:96px;width:520px;height:460px}
.shots img{position:absolute;width:440px;border-radius:14px;box-shadow:0 24px 50px -18px rgba(24,24,27,.35)}
.shots .a{right:70px;top:0;transform:rotate(-3deg)}
.shots .b{right:0;top:150px;transform:rotate(2deg)}
.shots .c{right:110px;top:290px;transform:rotate(-1.5deg)}
</style></head>
<body>
<i class="glow"></i><i class="dots"></i>
<div class="copy">
  <div class="logo"><i></i>bibiis.ai</div>
  <span class="badge">기획 · 개발 · 디자인을 한 사람이 끝까지</span>
  <h1>업무 자동화부터<br><em>사내 시스템</em>까지,<br>기획하고 직접 만들어요.</h1>
</div>
<div class="proof"><span><b>5개 법인</b>이 매일 쓰는 근태·결재</span><span>오픈까지 <b>26일</b></span><span>30분 진단 무료</span></div>
<div class="shots">
  <img class="a" src="../assets/work/attendance/sc-01.webp" alt="">
  <img class="b" src="../assets/work/buildops/sc-02.webp" alt="">
  <img class="c" src="../assets/work/restaurant/sc-01.webp" alt="">
</div>
</body></html>
